[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "${VITE_API_URL}"

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/register"
  to = "/index.html"
  status = 200
